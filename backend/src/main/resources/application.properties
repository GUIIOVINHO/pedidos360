spring.application.name=pedidos360-backend
server.port=8080

# Base de datos H2 en memoria (simple para el encargo; se puede cambiar por
# MySQL/PostgreSQL en RDS, Azure SQL, etc. sin tocar el resto del codigo,
# solo estas propiedades y la dependencia del driver en el pom.xml)
spring.datasource.url=jdbc:h2:mem:pedidos360
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Ruta al archivo de credenciales de la cuenta de servicio de Firebase
# (se descarga desde la consola de Firebase, ver README).
firebase.credentials.path=firebase-service-account.json

# CORS: origen del frontend Angular en desarrollo
app.cors.allowed-origin=http://localhost:4200

# RabbitMQ local con panel de administracion.
#   AMQP:  localhost:5672
#   Panel: http://localhost:15672   (usuario: guest / clave: guest)
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: pedidos360-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data:
